version: 2

models:
  - name: silver_market_candles
    columns:
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]
      - name: close_price
        tests: [not_null]
      - name: volume
        tests: [not_null]

  - name: gold_daily_price_summary
    columns:
      - name: trade_date
        tests: [not_null]
      - name: day_open
        tests: [not_null]
      - name: day_close
        tests: [not_null]

  - name: gold_hourly_market_stats
    columns:
      - name: hour_start
        tests: [not_null]

  - name: gold_daily_volatility
    columns:
      - name: trade_date
        tests:
          - not_null
          - unique